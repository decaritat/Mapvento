[package]
name = "mapvento"
version = "0.1.0"
description = "Open-source route planner for hiking and cycling"
authors = ["Mapvento contributors"]
license = "GPL-3.0-or-later"
repository = "https://github.com/decaritat/Mapvento"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "mapvento_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.4", features = [] }
tauri-plugin-log = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tauri-plugin-opener = "2.7.2"
tauri-plugin-dialog = "2"
